name: Bug 反馈
description: 遇到了崩溃、卡顿或游戏逻辑错误？请使用此模板向我们报告。
title: "[Bug] 简短描述你遇到的问题 "
labels: ["bug"]
type: Bug
assignees: []

body:
  - type: markdown
    attributes:
      value: |
        感谢您花时间填写此表单！在提交之前，请确保您使用的是最新版本的整合包，并且没有自行添加额外的未知模组。
        如果遇到崩溃，请务必提供日志，否则我们将无法定位问题。

  - type: textarea
    id: description
    attributes:
      label: 问题描述
      description: 请清晰、简单地描述一下发生了什么。
      placeholder: "例如：放置维修台后游戏立即闪退，或者在进入下界时卡死。"
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: 复现步骤
      description: 请按顺序列出你是如何触发这个 Bug 的。
      placeholder: |
        例：
        1. 进入游戏
        2. 打开物品栏
        3. 放置自定义的维修台方块
        4. 游戏崩溃
    validations:
      required: true

  - type: dropdown
    id: os-family
    attributes:
      label: 操作系统类别
      description: 请选择你运行游戏的操作系统大分类。如果不知道，请选“未知”。
      options:
        - Windows
        - Linux
        - macOS
        - 其他
        - 未知
    validations:
      required: true

  - type: input
    id: os-version
    attributes:
      label: 操作系统详细版本
      description: "请查看 latest.log 的第二行，找到类似 `OS Windows 10 arch amd64` 的字段填入。如果你不知道，直接填“未知”即可，我们会根据日志排查。"
      placeholder: "例如: Windows 10 arch amd64 / 未知"
    validations:
      required: true

  - type: input
    id: pack-version
    attributes:
      label: 整合包版本
      description: "请填写精确的版本号。如果不知道，直接填“未知”。"
      placeholder: "v0.0.1-alpha / 未知"
    validations:
      required: true

  - type: input
    id: java-version
    attributes:
      label: Java 版本
      description: "请查看 latest.log 的第二行，找到类似 `java version 17.0.20.1 by Microsoft` 的字段填入。如果你不知道，直接填“未知”。"
      placeholder: "例如: 17.0.20.1 by Microsoft / 未知"
    validations:
      required: true

  - type: dropdown
    id: extra-mods
    attributes:
      label: 是否添加了额外模组
      description: 如果你自己往 mods 文件夹里塞了其他模组，请选“是”。
      options:
        - 否，仅使用整合包自带模组
        - 是，添加了其他模组
    validations:
      required: true

  - type: markdown
    attributes:
      value: |
        ### 核心部分：崩溃日志
        请勿直接截图日志！也请不要将几十万字的文本直接粘贴到这里。
        请打开 [mclo.gs](https://mclo.gs/) ，将游戏目录 `.minecraft/logs/latest.log` 文件传上去，然后将生成的链接粘贴在下方。
        如果是直接闪退，请同时检查 `.minecraft/crash-reports` 文件夹里是否有最新的错误报告。

  - type: input
    id: log-link
    attributes:
      label: 日志链接
      description: 必须提供 mclo.gs 或 Pastebin 的链接。如果只写“无”或“不会弄”，此 Issue 将被直接关闭。
      placeholder: "https://mclo.gs/..."
    validations:
      required: true

  - type: textarea
    id: screenshots
    attributes:
      label: 截图或视频
      description: 如果有视觉上的错误（如贴图丢失、模型穿模），可以直接将图片拖拽到这里。
    validations:
      required: false

  - type: checkboxes
    id: checklist
    attributes:
      label: 提交确认
      description: 请确认以下事项后再提交。
      options:
        - label: 我已经搜索了现有的 Issues，确认这是一个全新且未被报告过的问题。
          required: true
        - label: 我已经按要求提供了完整的日志链接，并知晓没有日志的 Issue 可能会被直接关闭。
          required: true
